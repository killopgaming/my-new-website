<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00f5ff" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Circular Base -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="4"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="#00f5ff" stroke-width="1" opacity="0.4"/>

  <!-- Ice Bear Ears -->
  <circle cx="42" cy="30" r="10" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
  <circle cx="42" cy="30" r="5" fill="#e2e8f0"/>
  
  <circle cx="86" cy="30" r="10" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
  <circle cx="86" cy="30" r="5" fill="#e2e8f0"/>

  <!-- Bear Head & Body Silhouette -->
  <!-- Main Head & Body Base -->
  <path d="M34,60 C32,36 44,24 64,24 C84,24 96,36 94,60 C94,84 100,105 100,120 L28,120 C28,105 34,84 34,60 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Snout / Muzzle Contour -->
  <path d="M50,48 C50,42 56,38 64,38 C72,38 78,42 78,48 C78,57 71,62 64,62 C57,62 50,57 50,48 Z" fill="#ffffff"/>
  
  <!-- Nose -->
  <ellipse cx="64" cy="45" rx="7" ry="4.5" fill="#0f172a"/>

  <!-- Mouth line (cool straight/subtle frown) -->
  <path d="M60,54 Q64,55 68,54" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Cool, squinted, deadpan Ice Bear expression) -->
  <line x1="47" y1="39" x2="55" y2="39" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <line x1="73" y1="39" x2="81" y2="39" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="51" cy="41" r="1.5" fill="#0f172a"/>
  <circle cx="77" cy="41" r="1.5" fill="#0f172a"/>

  <!-- Left Eyebrow / Expression twitch mark -->
  <line x1="48" y1="35" x2="54" y2="35" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="74" y1="35" x2="80" y2="35" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

  <!-- Folded Arms & Paws -->
  <path d="M34,82 C34,70 42,66 52,66 C62,66 70,72 80,72 C88,72 94,68 94,82 C94,94 82,98 64,98 C46,98 34,94 34,82 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Arm Fold Creases -->
  <path d="M40,78 C50,86 64,88 78,80" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M52,86 C60,92 70,91 76,86" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M46,74 Q52,70 60,76" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Cyber Cyan Status Blip -->
  <circle cx="98" cy="98" r="6" fill="#00ff9d" filter="url(#glow)"/>
  <circle cx="98" cy="98" r="3" fill="#ffffff"/>
</svg>
